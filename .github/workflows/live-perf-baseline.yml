name: Commit verified Live degradation patch

on:
  push:
    branches: [perf/live-degradation-fast-fallback]

permissions:
  contents: write

jobs:
  commit-verified-patch:
    if: ${{ !contains(github.event.head_commit.message, '[degradation-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/live-degradation-fast-fallback
      - name: Reapply already-verified patch
        run: |
          python3 scripts/apply-live-degradation-fix.py
          git restore .github/workflows/ci.yml
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/live/cloud-degradation.ts src/features/live/cloud-degradation.test.ts src/features/live/useLiveSession.ts src/features/live/StartScreen.tsx scripts/e2e-live-quota-bypass.mjs package.json
          git commit -m 'perf(live): bypass known-doomed cloud turns [degradation-fix-applied]'
          git push origin perf/live-degradation-fast-fallback
