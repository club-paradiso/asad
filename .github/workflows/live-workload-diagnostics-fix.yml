name: Live workload diagnostics fix

on:
  push:
    branches:
      - fix/live-workload-diagnostics

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[diag-workload-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/live-workload-diagnostics
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply focused patch
        run: python3 scripts/apply-live-workload-diagnostics-fix.py
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Focused test
        run: npx vitest run src/providers/llm/live-workload.test.ts
      - name: Full unit suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Smoke
        run: npm run smoke:llm
      - name: Soak
        run: npm run soak -- --minutes 5
      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/providers/llm/capabilities.ts src/providers/llm/live-workload.test.ts src/app/api/config/route.ts src/app/api/diagnostics/route.ts src/features/diagnostics/DiagnosticsScreen.tsx
          git commit -m "fix(live): align quota diagnostics with actual profile [diag-workload-fixed]"
          git push origin HEAD:fix/live-workload-diagnostics
