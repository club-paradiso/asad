name: Production interpretation smoke (temporary)

on:
  push:
    branches:
      - ops/prod-smoke-20260910

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify production session and interpretation
        env:
          BASE_URL: https://asad-what.vercel.app
        run: |
          python3 - <<'PY'
          import http.cookiejar
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          base = os.environ["BASE_URL"].rstrip("/")
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))

          def request(path, payload):
              body = json.dumps(payload, ensure_ascii=False).encode("utf-8")
              req = urllib.request.Request(
                  base + path,
                  data=body,
                  method="POST",
                  headers={
                      "content-type": "application/json",
                      "origin": base,
                      "user-agent": "asad-production-smoke/1.0",
                  },
              )
              try:
                  with opener.open(req, timeout=25) as response:
                      return response.status, json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  text = exc.read().decode("utf-8", errors="replace")
                  print(f"HTTP {exc.code} {path}: {text}")
                  raise

          status, session = request("/api/session", {})
          assert status == 200, session
          assert session.get("ok") is True, session

          payload = {
              "mode": "general",
              "lag": "balanced",
              "pending": "오늘 제주 날씨가 정말 좋네요. 회의는 오후 세 시에 시작합니다.",
              "boundary": "sentence",
              "continuesPrevious": False,
              "context": {},
              "allowAnticipation": False,
          }
          status, result = request("/api/interpret", payload)
          print(json.dumps(result, ensure_ascii=False, indent=2))

          assert status == 200, result
          assert result.get("provider") != "local", result
          output = result.get("output") or {}
          chunks = output.get("safeChunks") or []
          assert chunks, result
          text = " ".join(str(chunk.get("text", "")) for chunk in chunks).strip()
          assert text, result
          assert "no interpretation model configured" not in text.lower(), result
          assert any(token in text.lower() for token in ["jeju", "weather", "meeting", "three", "3"]), result

          print("PRODUCTION_INTERPRETATION_SMOKE_OK")
          PY
