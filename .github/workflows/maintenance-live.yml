name: Live maintenance

on:
  push:
    branches:
      - fix/live-hook-and-dependency-audit

permissions:
  contents: write

jobs:
  patch-and-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/live-hook-and-dependency-audit
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Patch stale closure dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/features/live/useLiveSession.ts')
          s = p.read_text()
          old = '  }, [phase, interpret, prepareBrowserTranslator, resolveBible, teardown]);'
          new = '  }, [phase, interpret, prepareBrowserTranslator, resolveBible, script, teardown]);'
          if old in s:
              p.write_text(s.replace(old, new, 1))
              print('patched useLiveSession dependency array')
          elif new in s:
              print('dependency array already patched')
          else:
              raise SystemExit('expected dependency array not found')
          PY
      - name: Install current lockfile
        run: npm ci
      - name: Explain vulnerable transitive dependencies
        run: |
          npm explain js-yaml || true
          npm explain sharp || true
      - name: Apply non-breaking audit fix to lockfile
        run: npm audit fix --package-lock-only
      - name: Install repaired lockfile
        run: npm ci
      - name: Require zero high vulnerabilities
        run: npm audit --audit-level=high
      - name: Verify source and dependency repair
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Show repaired versions
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          for (const name of ['node_modules/js-yaml','node_modules/sharp']) {
            const p = lock.packages?.[name];
            console.log(`${name}: ${p?.version ?? 'not installed'}`);
          }
          NODE
          git diff --stat
      - name: Commit verified repair
        run: |
          if git diff --quiet; then
            echo 'No source or lockfile changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/live/useLiveSession.ts package-lock.json
          git commit -m 'fix(live): clear hook warning and vulnerable transitive deps'
          git push origin HEAD:fix/live-hook-and-dependency-audit
