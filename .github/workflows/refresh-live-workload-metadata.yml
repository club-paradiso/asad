name: Refresh Live workload metadata

on:
  push:
    branches:
      - perf/live-workload-metadata-refresh

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[workload-refreshed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/live-workload-metadata-refresh
      - name: Refresh measured ultra-compact values
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/interpreter/context/profiles.ts')
          s = p.read_text()
          old = '''    // Only ~20% below full: the system prompt dominates, so context trimming
              // has a hard floor. See docs/llm-benchmark.md.
              targetTokens: 2177,'''
          new = '''    // Refreshed after the dedicated ultra-compact system contract landed.
              // 2026-09-10 five-minute harness: p50 850, p95 934, max 950 tokens/call.
              targetTokens: 850,'''
          if old not in s:
              raise SystemExit('profile metadata target not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/providers/llm/capabilities.ts')
          s = p.read_text()
          s = s.replace(''' *   tokens/call  ultra       2,177
           *   sermon (45 min)         ~503 calls, ~1.37M tokens at full
           *
           * The important thing this revealed: the system prompt is ~1,700–1,900 of
           * those tokens, so trimming rolling CONTEXT barely moves the total. Context
           * profiles are worth ~20%; the system prompt is the real lever. That is why
           * the output contract is now dropped for providers that enforce the schema
           * natively, and why prompt caching is the highest-value remaining optimisation.''', ''' *   tokens/call  ultra         850  (refreshed 2026-09-10)
           *   sermon (45 min)         ~503 calls
           *
           * Full/compact remain the older reference measurements. Ultra-compact is
           * refreshed after its dedicated short system contract landed: the five-minute
           * harness measured p50 850, p95 934 and max 950 estimated tokens/call. This
           * is prompt/workload accounting, not a cloud-latency measurement.''', 1)
          s = s.replace('''  tokensPerCallUltraCompact: 2177,
            sermonMinutes: 45,
            measuredAt: "2026-08-24",''', '''  tokensPerCallUltraCompact: 850,
            sermonMinutes: 45,
            measuredAt: "2026-08-24",
            ultraCompactMeasuredAt: "2026-09-10",''', 1)
          s = s.replace('''    // Measured: even the ultra-compact profile costs ~2,177 tokens/call, and
              // at 11.17 calls/min that is ~24,300 TPM against a 6,000 free-tier limit.
              // No context profile rescues this — the system prompt alone exceeds it.
              // Groq free is therefore a fallback and a benchmark target, not a live
              // default. Its paid Developer tier (250k+ TPM) is entirely viable.''', '''    // Refreshed ultra-compact p50 is ~850 tokens/call. At 11.17 calls/min that
              // is still ~9,500 TPM against a 6,000 free-tier limit, so Groq free
              // remains unable to sustain the measured live workload. It stays a
              // fallback/benchmark target rather than a live default.''', 1)
          if 'tokensPerCallUltraCompact: 850' not in s or 'ultraCompactMeasuredAt' not in s:
              raise SystemExit('capabilities metadata target not found')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/interpreter/context/profiles.ts src/providers/llm/capabilities.ts
          git commit -m "docs(perf): refresh ultra-compact workload metadata [workload-refreshed]"
          git push origin HEAD:perf/live-workload-metadata-refresh
