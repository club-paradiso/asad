          s = p.read_text()
          needle = '''  it("flushes final stable speech immediately during graceful shutdown", async () => {'''
          insert = '''  it("measures one turn from the original stable event without server clock math", async () => {\n    let now = 1000;\n    let timing: import("@/interpreter/engine/session").TurnTiming | null = null;\n    const engine = new InterpretationEngine({\n      mode: "sermon", lag: "balanced", now: () => now, onChange: () => {},\n      onTurnTiming: (next) => { timing = next; },\n      interpret: async () => ({ output: output("Measured English"), clientDispatchedAt: now, provider: "test-provider", model: "test-model" }),\n    });\n    engine.start();\n    engine.handleStable("이 문장은 안정화 시점부터 측정됩니다.");\n    now += 900;\n    engine.tick();\n    await vi.waitFor(() => expect(timing).not.toBeNull());\n    const measured = timing as unknown as import("@/interpreter/engine/session").TurnTiming;\n    expect(measured.stableAt).toBe(1000);\n    expect(measured.clientDispatchedAt).toBe(1900);\n    expect(measured.safeAt).toBe(1900);\n    expect(measured.hasSafe).toBe(true);\n    expect(measured.provider).toBe("test-provider");\n  });\n\n  it("flushes final stable speech immediately during graceful shutdown", async () => {'''
          assert needle in s
          p.write_text(s.replace(needle, insert, 1))

          p = Path('scripts/e2e-live-fallback.mjs')
          s = p.read_text()
          old = '''      window.setTimeout(() => {\n        this.onresult?.({\n          resultIndex: 0,\n          results: {\n            length: 1,\n            0: {\n              isFinal: true,\n              length: 1,\n              0: {\n                transcript: "오늘 우리는 서로를 사랑해야 합니다.",\n                confidence: 0.99,\n              },\n            },\n          },\n        });\n      }, 350);'''
          new = '''      const first = { isFinal: true, length: 1, 0: { transcript: "오늘 우리는 서로를 사랑해야 합니다.", confidence: 0.99 } };\n      window.setTimeout(() => { this.onresult?.({ resultIndex: 0, results: { length: 1, 0: first } }); }, 350);\n      window.setTimeout(() => {\n        this.onresult?.({\n          resultIndex: 1,\n          results: {\n            length: 2,\n            0: first,\n            1: { isFinal: true, length: 1, 0: { transcript: "그리고 오늘도 함께 걸어갑니다.", confidence: 0.99 } },\n          },\n        });\n      }, 2200);'''
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace('''let forcedInterpretCalls = 0;\nawait page.route''', '''let forcedInterpretCalls = 0;\nconst forcedInterpretBodies = [];\nawait page.route''', 1)
          needle = '''  forcedInterpretCalls += 1;\n  await route.fulfill({'''
          replacement = '''  forcedInterpretCalls += 1;\n  forcedInterpretBodies.push(JSON.parse(route.request().postData() ?? "{}"));\n  await route.fulfill({'''
          assert needle in s
          s = s.replace(needle, replacement, 1)
          needle = '''const body = await page.locator("body").innerText();\nconst translatorState'''
          replacement = '''const secondCallDeadline = Date.now() + 8_000;\nwhile (forcedInterpretCalls < 2 && Date.now() < secondCallDeadline) await page.waitForTimeout(100);\nconst body = await page.locator("body").innerText();\nconst secondTelemetry = forcedInterpretBodies[1]?.clientTelemetry ?? [];\nconst secondTelemetryStages = new Set(secondTelemetry.map((sample) => sample.stage));\nconst translatorState'''
          assert needle in s
          s = s.replace(needle, replacement, 1)
          needle = '''check(\n  "Start gesture prepared the browser Translator",'''
          insert = '''check(\n  "a later Live turn piggybacks earlier client latency",\n  forcedInterpretCalls >= 2 && secondTelemetryStages.has("stable_to_client_dispatch") && secondTelemetryStages.has("stable_to_safe") && secondTelemetryStages.has("stable_to_render"),\n  `${secondTelemetry.length} client sample(s) on turn 2`,\n);\ncheck(\n  "client latency payload contains no transcript text",\n  !JSON.stringify(secondTelemetry).includes("오늘") && !JSON.stringify(secondTelemetry).includes("사랑"),\n);\ncheck(\n  "Start gesture prepared the browser Translator",'''
          assert needle in s
          p.write_text(s.replace(needle, insert, 1))
