name: Client end-to-end latency instrumentation

on:
  push:
    branches: [perf/client-e2e-latency]

permissions:
  contents: write

jobs:
  instrument-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[client-latency-applied]') }}
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/client-e2e-latency
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply client latency instrumentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/lib/schema.ts')
          s = p.read_text()
          needle = 'export const lagSchema = z.enum(["fast", "balanced", "safe"]);\n'
          insert = '''export const lagSchema = z.enum(["fast", "balanced", "safe"]);\n\n/** Browser-measured live latency. Never contains transcript content. */\nexport const clientLatencyStageSchema = z.enum([\n  "stable_to_client_dispatch",\n  "stable_to_safe",\n  "stable_to_anticipated",\n  "stable_to_render",\n]);\n\nexport const clientLatencySampleSchema = z.object({\n  id: z.string().min(1).max(80).regex(/^[A-Za-z0-9:_-]+$/),\n  stage: clientLatencyStageSchema,\n  ms: z.number().finite().nonnegative().max(120_000),\n  provider: z.string().min(1).max(80).optional(),\n  model: z.string().min(1).max(160).optional(),\n});\n\nexport type ClientLatencyStage = z.infer<typeof clientLatencyStageSchema>;\nexport type ClientLatencySample = z.infer<typeof clientLatencySampleSchema>;\n\nexport const clientTelemetryBatchSchema = z.object({\n  samples: z.array(clientLatencySampleSchema).min(1).max(24),\n});\n'''
          assert needle in s
          s = s.replace(needle, insert, 1)
          needle = '''  allowAnticipation: z.boolean().default(true),\n});'''
          replacement = '''  /** Completed client timings from earlier turns, piggybacked without another request. */\n  clientTelemetry: z.array(clientLatencySampleSchema).max(24).optional(),\n  allowAnticipation: z.boolean().default(true),\n});'''
          assert needle in s
          p.write_text(s.replace(needle, replacement, 1))

          p = Path('src/lib/telemetry.ts')
          s = p.read_text()
          marker = ' */\n\n/** The stages the live path is measured across. */'
          assert marker in s
          s = s.replace(marker, ' */\n\nimport type { ClientLatencySample } from "@/lib/schema";\n\n/** The stages the live path is measured across. */', 1)
          old = '''export type LatencyStage =\n  /** Server received request → provider dispatch. */\n  | "trigger_to_dispatch"\n  /** Request dispatched → complete validated provider response. */\n  | "provider_response"\n  /** Server received request → validated safe English ready to return. */\n  | "server_to_safe"\n  /** Stabilised Korean → safe English available to render. */\n  | "stable_to_safe"\n  /** Stabilised Korean → anticipated English available to render. */\n  | "stable_to_anticipated";'''
          new = '''export type LatencyStage =\n  /** Browser stable event → the first network dispatch for that turn. */\n  | "stable_to_client_dispatch"\n  /** Server received request → provider dispatch. */\n  | "trigger_to_dispatch"\n  /** Request dispatched → complete validated provider response. */\n  | "provider_response"\n  /** Server received request → validated safe English ready to return. */\n  | "server_to_safe"\n  /** Browser stable event → validated safe chunks applied to engine state. */\n  | "stable_to_safe"\n  /** Browser stable event → anticipated chunks applied to engine state. */\n  | "stable_to_anticipated"\n  /** Browser stable event → React committed the safe chunk update. */\n  | "stable_to_render";'''
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace('''  /** Stabilised Korean → safe English on screen. */\n  stable_to_safe: { p50: 2500, p95: 4500 },''', '''  /** Stabilised Korean → safe English committed on screen. */\n  stable_to_render: { p50: 2500, p95: 4500 },''', 1)
          s = s.replace('''/** Bounded ring buffer — a 70-minute session must not grow without limit. */\nconst MAX_SAMPLES = 600;''', '''/** Enough latency slots for every stage of one 45-minute service, still bounded. */\nconst MAX_LATENCY_SAMPLES = 3_600;\nconst MAX_TOKEN_SAMPLES = 600;\nconst MAX_CLIENT_SAMPLE_IDS = 2_000;''', 1)
          s = s.replace('''  private failures = new Map<string, number>();\n  private schemaAttempts = 0;''', '''  private failures = new Map<string, number>();\n  private clientSampleIds = new Set<string>();\n  private clientSampleIdOrder: string[] = [];\n  private schemaAttempts = 0;''', 1)
          s = s.replace('''    if (this.latency.length > MAX_SAMPLES) this.latency.shift();\n  }\n\n  recordTokens''', '''    if (this.latency.length > MAX_LATENCY_SAMPLES) this.latency.shift();\n  }\n\n  /** Record a browser sample once even when an HTTP retry replays its batch. */\n  recordClientLatency(sample: ClientLatencySample): boolean {\n    if (this.clientSampleIds.has(sample.id)) return false;\n    this.clientSampleIds.add(sample.id);\n    this.clientSampleIdOrder.push(sample.id);\n    if (this.clientSampleIdOrder.length > MAX_CLIENT_SAMPLE_IDS) {\n      const oldest = this.clientSampleIdOrder.shift();\n      if (oldest) this.clientSampleIds.delete(oldest);\n    }\n    this.recordLatency({\n      stage: sample.stage,\n      ms: Math.round(sample.ms),\n      provider: sample.provider,\n      model: sample.model,\n    });\n    return true;\n  }\n\n  recordTokens''', 1)
          s = s.replace('''    if (this.tokens.length > MAX_SAMPLES) this.tokens.shift();''', '''    if (this.tokens.length > MAX_TOKEN_SAMPLES) this.tokens.shift();''', 1)
          s = s.replace('''      latency: {\n        trigger_to_dispatch: this.stage("trigger_to_dispatch"),''', '''      latency: {\n        stable_to_client_dispatch: this.stage("stable_to_client_dispatch"),\n        trigger_to_dispatch: this.stage("trigger_to_dispatch"),''', 1)
          s = s.replace('''        stable_to_anticipated: this.stage("stable_to_anticipated"),\n      },''', '''        stable_to_anticipated: this.stage("stable_to_anticipated"),\n        stable_to_render: this.stage("stable_to_render"),\n      },''', 1)
          s = s.replace('''    this.failures.clear();\n    this.schemaAttempts = 0;''', '''    this.failures.clear();\n    this.clientSampleIds.clear();\n    this.clientSampleIdOrder = [];\n    this.schemaAttempts = 0;''', 1)
          p.write_text(s)

          p = Path('src/interpreter/engine/session.ts')
          s = p.read_text()
          old = '''export interface InterpretResult {\n  output: InterpreterOutput;\n  degraded?: boolean;\n  reason?: string;\n}\n\nexport interface EngineOptions {'''
          new = '''export interface InterpretResult {\n  output: InterpreterOutput;\n  degraded?: boolean;\n  reason?: string;\n  /** Browser clock time immediately before the first fetch for this turn. */\n  clientDispatchedAt?: number;\n  provider?: string;\n  model?: string;\n}\n\nexport interface TurnTiming {\n  stableAt: number;\n  clientDispatchedAt?: number;\n  safeAt: number;\n  provider?: string;\n  model?: string;\n  hasSafe: boolean;\n  hasAnticipated: boolean;\n}\n\nexport interface EngineOptions {'''
          assert old in s
          s = s.replace(old, new, 1)
          needle = '''  /** Optional Scripture text resolution. Omitted in demo/offline. */\n  resolveBible?: (reference: BibleReference) => Promise<BibleReference>;\n  onChange: (snapshot: EngineSnapshot) => void;'''
          replacement = '''  /** Optional Scripture text resolution. Omitted in demo/offline. */\n  resolveBible?: (reference: BibleReference) => Promise<BibleReference>;\n  /** Browser-only latency hook. Carries times and provider labels, never text. */\n  onTurnTiming?: (timing: TurnTiming) => void;\n  onChange: (snapshot: EngineSnapshot) => void;'''
          assert needle in s
          s = s.replace(needle, replacement, 1)
          needle = '''  private stabiliser: StabiliserState = emptyStabiliser();\n\n  private connection'''
          replacement = '''  private stabiliser: StabiliserState = emptyStabiliser();\n  /** Oldest stable event represented by pending text, preserved across a failed turn. */\n  private pendingOriginAt: number | null = null;\n\n  private connection'''
          assert needle in s
          s = s.replace(needle, replacement, 1)
          s = s.replace('''    this.lastBoundary = null;\n    this.stabiliser = { ...emptyStabiliser(), lastEventAt: 0 };''', '''    this.lastBoundary = null;\n    this.pendingOriginAt = null;\n    this.stabiliser = { ...emptyStabiliser(), lastEventAt: 0 };''', 1)
          old = '''    this.segments = [\n      ...this.segments,\n      { id: nextSegmentId(), text: corrected, at: this.elapsed() },\n    ];\n    this.partial = null;\n    this.stabiliser = pushStable(this.stabiliser, corrected, this.clock);'''
          new = '''    const stableAt = this.clock;\n    this.segments = [\n      ...this.segments,\n      { id: nextSegmentId(), text: corrected, at: Math.max(0, stableAt - this.startedAt) },\n    ];\n    this.partial = null;\n    if (!this.stabiliser.pending.trim() && this.pendingOriginAt === null) {\n      this.pendingOriginAt = stableAt;\n    }\n    this.stabiliser = pushStable(this.stabiliser, corrected, stableAt);'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''  private async flush(reason: FlushBoundary): Promise<void> {\n    const { text: pending, state } = drain(this.stabiliser);\n    this.stabiliser = state;\n    if (!pending) return;'''
          new = '''  private async flush(reason: FlushBoundary): Promise<void> {\n    const stableAt = this.pendingOriginAt ?? this.stabiliser.pendingSince ?? this.clock;\n    const { text: pending, state } = drain(this.stabiliser);\n    this.stabiliser = state;\n    this.pendingOriginAt = null;\n    if (!pending) return;'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''      this.applyOutput(result.output, allowAnticipation);\n      this.setHealth("llm", result.degraded ? "degraded" : "ok", result.reason);'''
          new = '''      this.applyOutput(result.output, allowAnticipation);\n      const safeAt = this.clock;\n      this.options.onTurnTiming?.({\n        stableAt,\n        clientDispatchedAt: result.clientDispatchedAt,\n        safeAt,\n        provider: result.provider,\n        model: result.model,\n        hasSafe: result.output.safeChunks.length > 0,\n        hasAnticipated:\n          allowAnticipation && (result.output.anticipatedChunks?.length ?? 0) > 0,\n      });\n      this.setHealth("llm", result.degraded ? "degraded" : "ok", result.reason);'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''      this.stabiliser = restorePending(this.stabiliser, pending, this.clock);\n      this.setHealth('''
          new = '''      this.stabiliser = restorePending(this.stabiliser, pending, this.clock);\n      this.pendingOriginAt = Math.min(this.pendingOriginAt ?? stableAt, stableAt);\n      this.setHealth('''
          assert old in s
          p.write_text(s.replace(old, new, 1))

          Path('src/features/live/client-latency.ts').write_text('''"use client";\n\nimport type { ClientLatencySample, ClientLatencyStage } from "@/lib/schema";\n\nconst MAX_PENDING = 24;\n\n/** Small transcript-free queue. Samples ride on the next interpretation turn. */\nexport class ClientLatencyQueue {\n  private pending: ClientLatencySample[] = [];\n  private counter = 0;\n\n  constructor(private readonly prefix = `c${Date.now().toString(36)}`) {}\n\n  add(stage: ClientLatencyStage, ms: number, provider?: string, model?: string): ClientLatencySample | null {\n    if (!Number.isFinite(ms) || ms < 0) return null;\n    const sample: ClientLatencySample = {\n      id: `${this.prefix}-${(this.counter += 1).toString(36)}`,\n      stage,\n      ms: Math.min(120_000, Math.round(ms)),\n      ...(provider ? { provider } : {}),\n      ...(model ? { model } : {}),\n    };\n    this.pending.push(sample);\n    if (this.pending.length > MAX_PENDING) this.pending.shift();\n    return sample;\n  }\n\n  batch(limit = MAX_PENDING): ClientLatencySample[] {\n    return this.pending.slice(0, Math.max(0, Math.min(MAX_PENDING, limit)));\n  }\n\n  acknowledge(ids: Iterable<string>): void {\n    const accepted = new Set(ids);\n    if (accepted.size === 0) return;\n    this.pending = this.pending.filter((sample) => !accepted.has(sample.id));\n  }\n\n  get size(): number { return this.pending.length; }\n}\n''')

          Path('src/features/live/client-latency.test.ts').write_text('''import { describe, expect, it } from "vitest";\nimport { ClientLatencyQueue } from "./client-latency";\n\ndescribe("ClientLatencyQueue", () => {\n  it("stores timing only and acknowledges a piggybacked batch", () => {\n    const queue = new ClientLatencyQueue("test");\n    queue.add("stable_to_safe", 1234.4, "openrouter", "model-x");\n    queue.add("stable_to_render", 1301.8, "openrouter", "model-x");\n    const batch = queue.batch();\n    expect(batch).toHaveLength(2);\n    expect(batch[0]).toEqual({ id: "test-1", stage: "stable_to_safe", ms: 1234, provider: "openrouter", model: "model-x" });\n    expect(JSON.stringify(batch)).not.toContain("transcript");\n    queue.acknowledge([batch[0].id]);\n    expect(queue.batch()).toHaveLength(1);\n  });\n\n  it("bounds an offline queue and rejects impossible durations", () => {\n    const queue = new ClientLatencyQueue("bounded");\n    expect(queue.add("stable_to_safe", -1)).toBeNull();\n    for (let i = 0; i < 30; i += 1) queue.add("stable_to_render", i);\n    expect(queue.size).toBe(24);\n  });\n});\n''')

          p = Path('src/features/live/useLiveSession.ts')
          s = p.read_text()
          needle = 'import { guardedFetch } from "@/lib/session-client";\n'
          replacement = 'import { guardedFetch } from "@/lib/session-client";\nimport { ClientLatencyQueue } from "./client-latency";\n'
          assert needle in s
          s = s.replace(needle, replacement, 1)
          needle = '''  const mountedRef = useRef(true);\n\n  const script: DemoScript'''
          replacement = '''  const mountedRef = useRef(true);\n  const clientLatencyRef = useRef(new ClientLatencyQueue());\n  const pendingRenderLatencyRef = useRef<Array<{ stableAt: number; provider?: string; model?: string }>>([]);\n\n  const script: DemoScript'''
          assert needle in s
          s = s.replace(needle, replacement, 1)
          needle = '''  useEffect(() => {\n    optionsRef.current = options;\n  }, [options]);\n\n  /**\n   * Begin Chrome's local ko→en translator'''
          replacement = '''  useEffect(() => {\n    optionsRef.current = options;\n  }, [options]);\n\n  useEffect(() => {\n    if (pendingRenderLatencyRef.current.length === 0) return;\n    const renderedAt = Date.now();\n    const markers = pendingRenderLatencyRef.current.splice(0);\n    for (const marker of markers) {\n      clientLatencyRef.current.add("stable_to_render", renderedAt - marker.stableAt, marker.provider, marker.model);\n    }\n  }, [snapshot.chunks]);\n\n  const flushClientTelemetry = useCallback(() => {\n    if (optionsRef.current.source === "demo") return;\n    const samples = clientLatencyRef.current.batch();\n    if (samples.length === 0) return;\n    const ids = samples.map((sample) => sample.id);\n    void guardedFetch("/api/telemetry/live", {\n      method: "POST",\n      keepalive: true,\n      headers: { "content-type": "application/json" },\n      body: JSON.stringify({ samples }),\n    }).then((response) => {\n      if (response.ok) clientLatencyRef.current.acknowledge(ids);\n    }).catch(() => {});\n  }, []);\n\n  /**\n   * Begin Chrome's local ko→en translator'''
          assert needle in s
          s = s.replace(needle, replacement, 1)
          needle = '''  const interpret = useCallback(\n    async (request: InterpretRequest, signal: AbortSignal): Promise<InterpretResult> => {\n      /**'''
          replacement = '''  const interpret = useCallback(\n    async (request: InterpretRequest, signal: AbortSignal): Promise<InterpretResult> => {\n      let firstClientDispatchedAt: number | undefined;\n\n      /**'''
          assert needle in s
          s = s.replace(needle, replacement, 1)
          old = '''            return {\n              output,\n              degraded: true,\n              reason: `${reason} Chrome on-device Korean→English backup was used.`,\n            };'''
          new = '''            return {\n              output,\n              degraded: true,\n              reason: `${reason} Chrome on-device Korean→English backup was used.`,\n              clientDispatchedAt: firstClientDispatchedAt,\n              provider: "browser-on-device",\n              model: "chrome-translator",\n            };'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''        return {\n          output: interpretLocally({\n            pending: request.pending,\n            mode: request.mode,\n            scriptId: optionsRef.current.source === "demo" ? script.id : undefined,\n            allowAnticipation: request.allowAnticipation,\n          }),\n          degraded: true,\n          reason,\n        };'''
          new = '''        return {\n          output: interpretLocally({\n            pending: request.pending,\n            mode: request.mode,\n            scriptId: optionsRef.current.source === "demo" ? script.id : undefined,\n            allowAnticipation: request.allowAnticipation,\n          }),\n          degraded: true,\n          reason,\n          clientDispatchedAt: firstClientDispatchedAt,\n          provider: "local",\n          model: "deterministic",\n        };'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''        return {\n          output: interpretLocally({\n            pending: request.pending,\n            mode: request.mode,\n            scriptId: script.id,\n            allowAnticipation: request.allowAnticipation,\n          }),\n        };\n      }\n\n      let lastFailure'''
          new = '''        return {\n          output: interpretLocally({\n            pending: request.pending,\n            mode: request.mode,\n            scriptId: script.id,\n            allowAnticipation: request.allowAnticipation,\n          }),\n          provider: "local",\n          model: "deterministic",\n        };\n      }\n\n      const clientTelemetry = clientLatencyRef.current.batch();\n      const telemetryIds = clientTelemetry.map((sample) => sample.id);\n      const wireRequest: InterpretRequest = clientTelemetry.length > 0 ? { ...request, clientTelemetry } : request;\n\n      let lastFailure'''
          assert old in s
          s = s.replace(old, new, 1)
          needle = '''          const response = await guardedFetch("/api/interpret", {\n            method: "POST",'''
          replacement = '''          if (firstClientDispatchedAt === undefined) firstClientDispatchedAt = Date.now();\n          const response = await guardedFetch("/api/interpret", {\n            method: "POST",'''
          assert needle in s
          s = s.replace(needle, replacement, 1)
          s = s.replace('''            body: JSON.stringify(request),''', '''            body: JSON.stringify(wireRequest),''', 1)
          needle = '''          if (response.ok) {\n            const data = (await response.json()) as {\n              output: unknown;\n              provider?: string;\n              degraded?: boolean;\n              reason?: string;\n            };'''
          replacement = '''          if (response.ok) {\n            if (telemetryIds.length > 0) clientLatencyRef.current.acknowledge(telemetryIds);\n            const data = (await response.json()) as {\n              output: unknown;\n              provider?: string;\n              model?: string;\n              degraded?: boolean;\n              reason?: string;\n            };'''
          assert needle in s
