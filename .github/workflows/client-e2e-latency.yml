          replacement = '''  const input = parsed.data;\n  for (const sample of input.clientTelemetry ?? []) telemetry.recordClientLatency(sample);\n  const router = llmRouter();'''
          assert needle in s
          p.write_text(s.replace(needle, replacement, 1))

          route = Path('src/app/api/telemetry/live/route.ts')
          route.parent.mkdir(parents=True, exist_ok=True)
          route.write_text('''import { NextResponse } from "next/server";\nimport { clientTelemetryBatchSchema } from "@/lib/schema";\nimport { guardInferenceRoute } from "@/lib/guard";\nimport { telemetry } from "@/lib/telemetry";\n\nexport const runtime = "nodejs";\nexport const dynamic = "force-dynamic";\nconst MAX_BODY_BYTES = 8 * 1024;\n\n/** Final browser latency samples that had no next interpretation turn to ride on. */\nexport async function POST(request: Request) {\n  const guarded = await guardInferenceRoute(request, { requireSession: true, maxBodyBytes: MAX_BODY_BYTES, limits: [] });\n  if (!guarded.ok) return guarded.response;\n  const parsed = clientTelemetryBatchSchema.safeParse(guarded.body);\n  if (!parsed.success) return NextResponse.json({ error: "Invalid telemetry batch." }, { status: 400 });\n  for (const sample of parsed.data.samples) telemetry.recordClientLatency(sample);\n  return new NextResponse(null, { status: 204 });\n}\n''')

          p = Path('src/lib/schema.test.ts')
          s = p.read_text()
          needle = '''  it("rejects an empty pending buffer", () => {'''
          insert = '''  it("accepts bounded transcript-free client latency samples", () => {\n    const result = interpretRequestSchema.safeParse({ ...base, clientTelemetry: [{ id: "c1-1", stage: "stable_to_render", ms: 1840, provider: "openrouter" }] });\n    expect(result.success).toBe(true);\n  });\n\n  it("rejects invalid client latency stages", () => {\n    const result = interpretRequestSchema.safeParse({ ...base, clientTelemetry: [{ id: "c1-1", stage: "raw_transcript", ms: 20 }] });\n    expect(result.success).toBe(false);\n  });\n\n  it("rejects an empty pending buffer", () => {'''
          assert needle in s
