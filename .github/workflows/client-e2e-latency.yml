          old = '''      setSnapshot(finalSnapshot);\n      setPhase("ended");\n      return finalSnapshot;'''
          new = '''      setSnapshot(finalSnapshot);\n      setPhase("ended");\n      flushClientTelemetry();\n      return finalSnapshot;'''
