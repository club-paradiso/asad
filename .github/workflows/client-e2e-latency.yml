      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Local LLM smoke
        run: npm run smoke:llm
      - name: Soak
        run: npm run soak -- --minutes 5
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start app and run browser fallback telemetry E2E
        run: |
          npm run start -- -p 3000 > /tmp/asad.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://localhost:3000 >/dev/null; then break; fi
            sleep 1
          done
          npm run e2e:live-fallback -- http://localhost:3000 ./e2e-out
      - name: Commit verified source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts/e2e-live-fallback.mjs tests/live-engine-reliability.test.ts
          git commit -m 'perf(live): measure browser end-to-end latency [client-latency-applied]'
          git push origin perf/client-e2e-latency
