name: Shared live telemetry verification

on:
  push:
    branches:
      - perf/shared-live-telemetry
    paths:
      - .github/workflows/shared-live-telemetry-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/shared-live-telemetry
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: python3 .github/scripts/apply-shared-live-telemetry.py
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Local LLM smoke
        run: npm run smoke:llm
      - name: Soak
        run: npm run soak -- --minutes 5
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: |
          npm run start -- -p 3000 > /tmp/asad.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://localhost:3000 >/dev/null; then break; fi
            sleep 1
          done
          npm run e2e -- http://localhost:3000 ./e2e-out
          npm run e2e:live-fallback -- http://localhost:3000 ./e2e-out
      - name: Commit verified source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'perf(live): aggregate latency in shared Redis'
          git push origin perf/shared-live-telemetry
