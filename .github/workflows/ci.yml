# Repository quality checks.
#
# Deliberately boring and fast: install, lint, typecheck, test, build. No real
# API keys — provider integration is exercised by the smoke test, which skips
# cleanly when no credential is configured, so CI never depends on a secret and
# never spends money.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a run can be kicked by hand without an empty commit. Every previous
  # attempt to re-trigger this workflow needed a push, which is a poor way to
  # debug CI.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # `playwright` is a devDependency for the e2e and screenshot scripts,
      # neither of which CI runs. Skipping its browser download keeps `npm ci`
      # from spending a couple of minutes fetching Chromium for nothing.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      # Printed before anything can go wrong, so a failing run always says
      # where it got to. Cheap, and it is what was missing when this workflow
      # was failing at startup with no output at all.
      - name: Runner facts
        run: |
          echo "runner: $RUNNER_OS $RUNNER_ARCH"
          echo "event:  $GITHUB_EVENT_NAME"
          echo "sha:    $GITHUB_SHA"

      # v5, not v4: the runner now forces v4 onto Node 24 and warns that its
      # Node 20 target is deprecated. v5 targets Node 24 natively.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          node -v
          npm -v
          npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Earbud synthetic benchmark harness (mock only, no API calls)
        run: npm run bench:earbud

      # Do not pound a free community provider with every PR commit.
      # Two synthetic inputs: Korean→English and English→Korean, explicitly
      # opt-in without secrets. An outage is a BLOCKER for provider activation,
      # not a failure of lint/typecheck/local unit tests.
      - name: Phase 4A Index live readiness check (2 fictional phrases)
        id: index_smoke
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/earbud-global-ko-en'
        timeout-minutes: 1
        continue-on-error: true
        run: npm run bench:earbud -- --index-live --confirm-synthetic-only --sources ko-KR,en-US --limit 2 --timeout-ms 5000 --output /tmp/asad-index-readiness.json

      - name: Phase 4A provider readiness verdict
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'feat/earbud-global-ko-en'
        env:
          INDEX_STEP: ${{ steps.index_smoke.outcome }}
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const result = fs.existsSync("/tmp/asad-index-readiness.json")
            ? JSON.parse(fs.readFileSync("/tmp/asad-index-readiness.json", "utf8"))
            : null;
          const s = result?.summary;
          const lines = [
            "### Phase 4A Index provider readiness (external, nonblocking)",
            "This is **not** an assertion of translation quality or iPhone playback.",
            "Result: **" + (s?.runStatus ?? "NOT_RUN") + "**",
            "Successful synthetic responses: **" + (s?.completed ?? 0) + "/" + (s?.fixtureCount ?? 2) + "**",
            "Deadline: " + (s?.perRequestDeadlineMs ?? "not run") + " ms",
            "P50 / P95: " + (s?.p50Ms ?? "n/a") + " / " + (s?.p95Ms ?? "n/a") + " ms",
            "External step outcome: " + process.env.INDEX_STEP,
            "Azure F0 was **not called**. No secret API keys used.",
            "If UNAVAILABLE, leave provider activation gated until a later manual check."
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          if (!s || s.runStatus !== "RESPONDING_WITH_BASIC_CHECKS")
            process.stdout.write("::warning::Index public API unavailable or slow. Do not interpret green CI as provider readiness.\n");
          NODE

      - name: Build
        run: npm run build

      # Runs against the local interpreter only when no key is configured,
      # which is the CI case. It verifies the harness itself still works.
      - name: LLM smoke test (local only, no credentials)
        run: npm run smoke:llm

      # A short soak proves the bounded-growth invariants on every PR without
      # making CI slow. The full 45-minute simulation is run as a targeted
      # reliability probe when Live's long-session behavior changes.
      - name: Soak (5 simulated minutes)
        run: npm run soak -- --minutes 5

      # The two-lane engine against mocked delayed lanes: bounded cloud
      # concurrency, bounded coalescing, no lost Korean, no rewritten history.
      # Simulated time only; it measures no real translator and no real cloud.
      - name: Two-lane soak (5 simulated minutes)
        run: npm run soak:two-lane -- --minutes 5

  # The checks a unit test cannot make: does the built app actually work in a
  # browser. Kept as a separate job so a failure here is legible on its own,
  # and because it needs Chromium, which the fast job has no use for.
  e2e:
    name: End-to-end flow
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # This job is the one place Chromium is wanted, so it is installed here
      # rather than on every `npm ci` in the repository.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # Started detached and waited for, rather than slept at: a fixed sleep is
      # either too short on a slow runner or wasted time on a fast one.
      - name: Start the server
        # Host candidates are all two local browser contexts need; skipping
        # public STUN keeps the Remote Microphone check off the network.
        env:
          REMOTE_MIC_STUN_URLS: none
        run: |
          npm start -- --port 3000 > /tmp/server.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/config > /dev/null; then
              echo "server up"
              exit 0
            fi
            sleep 1
          done
          echo "server never came up"
          cat /tmp/server.log
          exit 1

      - name: End-to-end checks
        run: npm run e2e -- http://localhost:3000 ./e2e-out

      - name: Forced browser fallback checks
        run: npm run e2e:live-fallback -- http://localhost:3000 ./e2e-out

      # What the console tells an interpreter when the recogniser fails, which
      # is the part of the product a unit test cannot see: that a healthy
      # session stays quiet, that the advice matches the actual fault, and that
      # no browser error code ever reaches the screen.
      - name: Live failure-state checks
        run: npm run e2e:live-failure -- http://localhost:3000 ./e2e-out

      - name: Quota degradation bypass checks
        run: npm run e2e:live-quota-bypass -- http://localhost:3000

      # Mocked window.Translator + delayed /api/interpret through the real
      # /live UI. Proves the application's two-lane semantics; it does not
      # exercise Chrome's downloadable Korean→English language pack.
      - name: Two-lane provisional/refinement checks
        run: npm run e2e:live-two-lane -- http://localhost:3000 ./e2e-out

      # One non-default language pair followed all the way down — picker,
      # recogniser locale, on-device translator, the wire, the console — plus a
      # pair that cannot work being refused before the microphone opens. It
      # checks what ASAD asks its providers for, not what they deliver.
      - name: Language-pair checks
        run: npm run e2e:live-languages -- http://localhost:3000

      # Real browser-to-browser WebRTC between two Chromium contexts: pairing,
      # approval, actual audio samples, the existing capture → STT path (mock
      # Deepgram socket), stop/restart, abrupt peer loss and failure paths.
      # Chromium with an iPhone viewport — not iOS Safari.
      - name: Remote microphone (WebRTC) checks
        run: npm run e2e:remote-mic -- http://localhost:3000 ./e2e-out/remote-mic

      # The screenshots are the point when a check fails: they show what the
      # page actually looked like, which no assertion message can.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: e2e-out/
          if-no-files-found: warn
          retention-days: 7

      - name: Server log
        if: failure()
        run: cat /tmp/server.log
