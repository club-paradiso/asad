# Repository quality checks.
#
# Deliberately boring and fast: install, lint, typecheck, test, build. No real
# API keys — provider integration is exercised by the smoke test, which skips
# cleanly when no credential is configured, so CI never depends on a secret and
# never spends money.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Runner facts
        run: |
          echo "runner: $RUNNER_OS $RUNNER_ARCH"
          echo "event:  $GITHUB_EVENT_NAME"
          echo "sha:    $GITHUB_SHA"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: |
          node -v
          npm -v
          npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: LLM smoke test (local only, no credentials)
        run: npm run smoke:llm
      - name: Soak (5 simulated minutes)
        run: npm run soak -- --minutes 5

  e2e:
    name: End-to-end flow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Start the server
        run: |
          npm start -- --port 3000 > /tmp/server.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/config > /dev/null; then
              echo "server up"
              exit 0
            fi
            sleep 1
          done
          echo "server never came up"
          cat /tmp/server.log
          exit 1
      - name: End-to-end checks
        run: npm run e2e -- http://localhost:3000 ./e2e-out
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: e2e-out/
          if-no-files-found: warn
          retention-days: 7
      - name: Server log
        if: failure()
        run: cat /tmp/server.log
