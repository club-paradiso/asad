name: Live latency optimization

on:
  push:
    branches: [perf/live-latency-telemetry]

permissions:
  contents: write

jobs:
  optimize-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[latency-opt-applied]') }}
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/live-latency-telemetry
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply targeted latency and telemetry changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/features/live/useLiveSession.ts')
          s = p.read_text()
          old = '/** How often the engine\'s clock advances. 200ms is well inside human latency. */\nconst TICK_MS = 200;'
          new = '/** How often the engine\'s clock advances. 100ms keeps trigger jitter below one tenth of a second. */\nconst TICK_MS = 100;'
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path('src/interpreter/prompts/live.ts')
          s = p.read_text()
          s = s.replace('fast: "LAG: FAST (~1s). Emit early and short. Prediction is welcome; the interpreter accepts correction risk.",', 'fast: "LAG: FAST (~1s). Emit early, short chunks. Anticipation is allowed.",')
          s = s.replace('    "LAG: BALANCED (~2–3s). Emit complete thought units. Predict only when the Korean is clearly mid-thought.",', '    "LAG: BALANCED (~2–3s). Emit complete thought units; anticipate only a clear mid-thought.",')
          s = s.replace('  safe: "LAG: SAFE (~4–6s). Wait for the thought to resolve. Do not predict at all. Accuracy over speed.",', '  safe: "LAG: SAFE (~4–6s). No anticipation. Accuracy first.",')
          old = '''      "CONTINUATION: the previous unit was cut before the speaker resolved it, so the English you returned then is an unfinished scaffold the interpreter is already saying. Carry it on from where it stopped — do not restart the sentence and do not repeat what you already delivered.",'''
          new = '''      "CONTINUATION: continue the unfinished English scaffold from the previous turn. Do not restart or repeat delivered English.",'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''      "OPEN END: this unit also stops mid-thought — the clock ended it, not the speaker. Commit to the structure, leave the payload unfinished, and mark the trailing chunk low if it depends on Korean that has not arrived.",'''
          new = '''      "OPEN END: this unit is still mid-thought. Keep the English structurally open; do not invent missing payload. Mark dependent trailing chunks low.",'''
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace('lines.push("CLOSED END: the speaker completed this thought. It is safe to finish the English sentence.");', 'lines.push("CLOSED END: the speaker completed the thought; finish the English sentence.");')
          p.write_text(s)

          p = Path('src/lib/telemetry.ts')
          s = p.read_text()
          old = '''  /** Request dispatched → complete validated provider response. */\n  | "provider_response"\n  /** Stabilised Korean → safe English available to render. */'''
          new = '''  /** Server received request → provider dispatch. */\n  | "trigger_to_dispatch"\n  /** Request dispatched → complete validated provider response. */\n  | "provider_response"\n  /** Server received request → validated safe English ready to return. */\n  | "server_to_safe"\n  /** Stabilised Korean → safe English available to render. */'''
          # replace existing first stage + provider section together to avoid duplicate trigger_to_dispatch
          old_full = '''  /** Stabilised Korean available → interpretation request dispatched. */\n  | "trigger_to_dispatch"\n  /** Request dispatched → complete validated provider response. */\n  | "provider_response"\n  /** Stabilised Korean → safe English available to render. */'''
          assert old_full in s
          s = s.replace(old_full, new, 1)
          old = '''        provider_response: this.stage("provider_response"),\n        stable_to_safe: this.stage("stable_to_safe"),'''
          new = '''        provider_response: this.stage("provider_response"),\n        server_to_safe: this.stage("server_to_safe"),\n        stable_to_safe: this.stage("stable_to_safe"),'''
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path('src/app/api/interpret/route.ts')
          s = p.read_text()
          needle = '''    telemetry.recordTokens({\n      provider: result.provider,'''
          insert = '''    telemetry.recordLatency({\n      stage: "server_to_safe",\n      ms: Date.now() - receivedAt,\n      provider: result.provider,\n      model: escalatedTo ?? result.model,\n    });\n    telemetry.recordTokens({\n      provider: result.provider,'''
          assert needle in s
          p.write_text(s.replace(needle, insert, 1))
          PY
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: LLM smoke
        run: npm run smoke:llm
      - name: Soak
        run: npm run soak -- --minutes 5
      - name: Commit verified changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/live/useLiveSession.ts src/interpreter/prompts/live.ts src/lib/telemetry.ts src/app/api/interpret/route.ts
          git commit -m 'perf(live): reduce trigger jitter and expose server latency [latency-opt-applied]'
          git push origin perf/live-latency-telemetry
