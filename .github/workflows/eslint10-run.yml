name: ESLint 10 verify

on:
  push:
    branches:
      - chore/eslint-10-migration

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/eslint-10-migration
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Upgrade ESLint
        run: npm install --save-dev eslint@10.10.0
      - name: Verify
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm run smoke:llm
          npm run soak -- --minutes 5
          npm audit --audit-level=high
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore: migrate lint toolchain to ESLint 10' || exit 0
          git push origin HEAD:chore/eslint-10-migration
