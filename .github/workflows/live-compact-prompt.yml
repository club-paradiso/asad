name: Wire and verify compact live prompt

on:
  push:
    branches:
      - perf/live-compact-system-prompt

permissions:
  contents: write

jobs:
  wire-verify:
    if: ${{ !contains(github.event.head_commit.message, '[compact-live-wired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/live-compact-system-prompt
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Wire production and benchmark hot paths
        run: |
          python - <<'PY'
          from pathlib import Path

          route = Path('src/app/api/interpret/route.ts')
          s = route.read_text()
          old = '''  const system = systemPromptFor(input.mode, {
            schemaEnforced: caps.structuredOutput,
          });'''
          new = '''  const system = systemPromptFor(input.mode, {
            schemaEnforced: caps.structuredOutput,
            ultraCompact: decision.profile === "ultra-compact",
          });'''
          if old not in s:
              raise SystemExit('interpret route patch target not found')
          route.write_text(s.replace(old, new, 1))

          harness = Path('benchmarks/live-harness.ts')
          s = harness.read_text()
          old = '    const system = systemPromptFor(request.mode);'
          new = '''    const system = systemPromptFor(request.mode, {
              schemaEnforced: caps.structuredOutput,
              ultraCompact: decision.profile === "ultra-compact",
            });'''
          if old not in s:
              raise SystemExit('live harness patch target not found')
          harness.write_text(s.replace(old, new, 1))
          PY

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Measure system prompts
        run: npm run measure:prompt

      - name: Five-minute ultra-compact live benchmark
        run: npm run bench:live -- --minutes 5 --profile ultra-compact

      - name: Commit verified wiring and benchmark
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/interpret/route.ts benchmarks/live-harness.ts benchmarks/results/live-5min-balanced.json
          git commit -m "perf(live): wire ultra-compact prompt into hot path [compact-live-wired]"
          git push origin HEAD:perf/live-compact-system-prompt
