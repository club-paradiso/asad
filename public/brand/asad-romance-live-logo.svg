<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">아무튼 서로 알아들었으면 된 거 아닌가요?</title>
  <desc id="desc">핑크와 골드 장식의 로맨스 판타지 패러디 ASAD 로고</desc>
  <defs>
    <linearGradient id="gold" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff5bb"/>
      <stop offset=".28" stop-color="#f5cf62"/>
      <stop offset=".55" stop-color="#b87218"/>
      <stop offset=".78" stop-color="#ffe09a"/>
      <stop offset="1" stop-color="#8b4d0c"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" x2="1">
      <stop offset="0" stop-color="#ff8ea8"/>
      <stop offset=".5" stop-color="#ffc0ce"/>
      <stop offset="1" stop-color="#f37b90"/>
    </linearGradient>
    <radialGradient id="blush">
      <stop offset="0" stop-color="#ffd9e4" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#8a4a54" flood-opacity=".22"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1500" height="500" rx="28" fill="#fffdfd"/>
  <ellipse cx="750" cy="244" rx="660" ry="205" fill="url(#blush)"/>

  <!-- lace-ish frame -->
  <g fill="none" stroke="#f1b6c2" stroke-width="2" opacity=".65">
    <path d="M70 100 C170 22 300 28 390 92 S600 40 750 88 S1030 40 1140 92 S1350 28 1430 100"/>
    <path d="M70 402 C170 478 300 472 390 408 S600 460 750 412 S1030 460 1140 408 S1350 472 1430 402"/>
  </g>

  <!-- sparkle field -->
  <g fill="#ef8ba1" opacity=".8">
    <path d="M160 72 l7 18 18 7-18 7-7 18-7-18-18-7 18-7z"/>
    <path d="M1325 72 l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/>
    <path d="M1220 390 l6 15 15 6-15 6-6 15-6-15-15-6 15-6z"/>
    <circle cx="260" cy="420" r="4"/><circle cx="1170" cy="100" r="4"/><circle cx="510" cy="64" r="3"/><circle cx="1010" cy="438" r="3"/>
  </g>

  <!-- crown -->
  <g transform="translate(675 20)" filter="url(#shadow)">
    <path d="M0 64 L18 18 48 50 75 6 102 50 132 18 150 64 Z" fill="url(#gold)" stroke="#9a5817" stroke-width="4"/>
    <rect x="8" y="58" width="134" height="28" rx="12" fill="url(#gold)" stroke="#9a5817" stroke-width="4"/>
    <path d="M75 38 c-18-20-38 1-29 16 8 12 29 25 29 25s21-13 29-25c9-15-11-36-29-16z" fill="#ff5f8b" stroke="#b93057" stroke-width="3"/>
    <circle cx="22" cy="67" r="5" fill="#ff6694"/><circle cx="75" cy="67" r="5" fill="#ff6694"/><circle cx="128" cy="67" r="5" fill="#ff6694"/>
  </g>

  <!-- speech bubble mascot -->
  <g transform="translate(70 145)" filter="url(#shadow)">
    <path d="M0 40 Q0 0 46 0 H154 Q200 0 200 40 V103 Q200 145 154 145 H62 L22 176 31 145 Q0 137 0 103Z" fill="#1e2530"/>
    <path d="M108 40 Q108 0 154 0 H262 Q308 0 308 40 V103 Q308 145 262 145 H216 L272 176 196 145 H154 Q108 145 108 103Z" fill="url(#rose)"/>
    <ellipse cx="154" cy="73" rx="59" ry="66" fill="#fff"/>
    <circle cx="136" cy="69" r="6" fill="#262933"/>
    <path d="M168 66 q12 8 22 0" fill="none" stroke="#262933" stroke-width="5" stroke-linecap="round"/>
    <path d="M138 94 q16 15 32 0" fill="none" stroke="#262933" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="120" cy="88" rx="14" ry="7" fill="#ffafbd" opacity=".6"/><ellipse cx="190" cy="88" rx="14" ry="7" fill="#ffafbd" opacity=".6"/>
    <g transform="translate(115 -25) scale(.55)">
      <path d="M0 64 L18 18 48 50 75 6 102 50 132 18 150 64 Z" fill="url(#gold)" stroke="#9a5817" stroke-width="5"/>
      <rect x="8" y="58" width="134" height="28" rx="12" fill="url(#gold)" stroke="#9a5817" stroke-width="5"/>
    </g>
  </g>

  <!-- roses -->
  <g fill="none" stroke="#e97f98" stroke-width="5" opacity=".78">
    <path d="M105 355 c-40-22-68 37-28 55 34 16 76-10 64-45-9-27-49-32-61-7-10 22 17 40 34 26"/>
    <path d="M1375 350 c40-22 68 37 28 55-34 16-76-10-64-45 9-27 49-32 61-7 10 22-17 40-34 26"/>
  </g>

  <!-- ornate flourishes -->
  <g fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" opacity=".95">
    <path d="M355 138 C420 92 485 107 520 146 C545 174 575 175 610 148"/>
    <path d="M1145 138 C1080 92 1015 107 980 146 C955 174 925 175 890 148"/>
    <path d="M380 362 C455 408 520 386 550 350 C575 320 610 320 650 348"/>
    <path d="M1120 362 C1045 408 980 386 950 350 C925 320 890 320 850 348"/>
  </g>

  <!-- title -->
  <g text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Noto Serif KR', serif" filter="url(#shadow)">
    <text x="820" y="206" font-size="86" font-weight="900" fill="url(#gold)" stroke="#7b4411" stroke-width="3" paint-order="stroke fill">아무튼 서로</text>
    <text x="820" y="302" font-size="76" font-weight="900" fill="url(#gold)" stroke="#7b4411" stroke-width="3" paint-order="stroke fill">알아들었으면 된 거 아닌가요?</text>
  </g>

  <!-- gem heart -->
  <path d="M748 337 c-16-20-42-5-35 16 7 19 35 37 35 37s28-18 35-37c7-21-19-36-35-16z" fill="#ff5f8b" stroke="#c13a61" stroke-width="3" filter="url(#glow)"/>

  <!-- silly ribbons -->
  <g font-family="'Noto Sans KR', Arial, sans-serif" font-size="20" font-weight="700" fill="#77414d">
    <path d="M36 378 Q142 348 268 378 L250 435 Q145 408 45 437Z" fill="#ffd1db" stroke="#e98ca1" stroke-width="3"/>
    <text x="145" y="397" text-anchor="middle">말은 달라도</text><text x="145" y="423" text-anchor="middle">심장은 통역됨♥</text>
    <path d="M1210 88 Q1330 58 1460 90 L1440 150 Q1325 122 1226 149Z" fill="#ffd1db" stroke="#e98ca1" stroke-width="3"/>
    <text x="1335" y="111" text-anchor="middle">오해해도 사랑해요</text><text x="1335" y="138" text-anchor="middle">재벌·황제 모두 OK★</text>
  </g>

  <!-- bottom plate -->
  <g transform="translate(565 405)" filter="url(#shadow)">
    <rect width="370" height="72" rx="28" fill="#fff8f2" stroke="url(#gold)" stroke-width="5"/>
    <text x="185" y="31" text-anchor="middle" font-family="Georgia, serif" font-size="28" letter-spacing="10" fill="#d34f75">ASAD</text>
    <text x="185" y="55" text-anchor="middle" font-family="'Noto Sans KR', Arial, sans-serif" font-size="16" letter-spacing="2" fill="#6f4b50">통역 · 번역 전문 서비스</text>
  </g>
</svg>