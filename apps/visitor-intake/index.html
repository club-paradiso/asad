<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#143e45"><title>출입국 방문 목적 · 오프라인 소통 키오스크</title><style id="offline-style">*{box-sizing:border-box}html{background:#f6f9f9;color:#193b3e;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans",Arial,sans-serif;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column}
.site-head{background:#fff;border-top:7px solid #087d70;padding:15px 4%;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.site-head img{display:block;max-width:340px;width:62%;height:auto}.site-head div{display:flex;flex-direction:column;gap:4px}.site-head strong{font-size:18px}.site-head small{color:#087d70;font-size:12px;font-weight:bold}
.container{width:100%;max-width:1080px;margin:0 auto;padding:24px 4%;flex:1}.hero{background:#e6f5f1;padding:26px;border-radius:22px;margin-bottom:21px}
.step{color:#087d70;font-size:13px;font-weight:bold;letter-spacing:.03em}.hero h1{font-size:34px;line-height:1.35;margin:9px 0 12px;word-wrap:break-word}.hero p{line-height:1.6}.hero p:last-child{font-size:18px;color:#557477;margin-bottom:0}
.panel{background:#fff;border:1px solid #d8e6e2;border-radius:18px;padding:23px;margin:17px 0}.panel h2{font-size:27px;line-height:1.4;word-wrap:break-word;margin:12px 0}.panel p{line-height:1.65}
.btn,.tile{font-family:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:rgba(8,125,112,.2);-webkit-appearance:none;appearance:none;color:#183b3f;border:1px solid #d5e6e1;background:#fff;border-radius:16px;padding:17px;font-size:19px;line-height:1.45;font-weight:bold;min-height:64px;text-align:left}
.btn.primary{background:#087d70;color:#fff;border-color:#087d70}.btn:disabled,.tile:disabled{opacity:.5;cursor:default}
.btn:focus,.tile:focus,input:focus{outline:3px solid #e7b04b;outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{width:100%;min-height:96px;display:flex;align-items:center;gap:12px;word-break:break-word;overflow-wrap:anywhere}
.tile:hover,.btn:hover{border-color:#087d70}.num{width:34px;min-width:34px;height:34px;background:#e6f5f1;color:#087d70;display:inline-flex;justify-content:center;align-items:center;border-radius:12px;font-size:14px}
.actions{display:flex;gap:12px;margin:22px 0;flex-wrap:wrap}.actions .btn{flex:1;text-align:center}
.choiceGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.choiceGrid .btn{width:100%;text-align:center}
.choiceGrid .btn[aria-pressed=true],.queueItem[aria-pressed=true]{background:#e6f5f1;border:3px solid #087d70}
.muted{font-size:15px;color:#60777a;line-height:1.65}.alert{background:#fff3df;color:#76501d;border-radius:12px;padding:16px;line-height:1.5}.error{background:#ffecdf;color:#873518;border-radius:12px;padding:16px;line-height:1.5}.success{background:#e6f5f1;color:#067467;border-radius:12px;padding:18px;line-height:1.6}
.code{font-family:Menlo,Consolas,monospace;font-size:30px;letter-spacing:.12em;font-weight:bold;color:#087d70;overflow-wrap:anywhere}
input[type=text]{width:100%;max-width:460px;border:2px solid #bdd5d0;border-radius:12px;padding:15px;font-size:23px;font-family:monospace;text-transform:uppercase}
.columns{display:flex;flex-wrap:wrap;gap:20px;align-items:center}.columns>div{flex:1;min-width:210px}
.qr{width:220px;max-width:100%;height:auto;border:1px solid #d8e6e2;border-radius:10px;padding:8px;background:white}
.queue{max-height:430px;overflow:auto}.queueItem{display:block;width:100%;text-align:left;background:#f9fbfa;border:1px solid #d8e6e2;border-radius:12px;padding:15px;margin:7px 0;cursor:pointer;font:inherit;line-height:1.6}
.queueItem strong,.queueItem small{display:block}.queueItem small{color:#087d70}.row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.badge{display:inline-block;background:#e6f5f1;border-radius:99px;padding:9px 12px;color:#087d70;font-weight:bold;font-size:14px}
button{max-width:100%}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;text-decoration:none}
.stationPicker{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:15px 0}
.stationPicker label{font-size:15px;font-weight:bold}
.stationPicker select{border:2px solid #bdd5d0;border-radius:12px;background:#fff;color:#193b3e;min-height:45px;padding:8px 12px;font:inherit}
.stationPicker select:focus{outline:3px solid #e7b04b;outline-offset:2px}
.queueItem.needsReview{border-left:5px solid #d89831}
.displayBar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid #d8e6e2;border-radius:14px;padding:8px 16px;margin-bottom:16px}
.displayBar .muted{margin:4px 0}.displayBar .btn{min-height:45px;font-size:15px;padding:8px 16px}
body.visitor.display-mode .container{max-width:1300px}
body.visitor.display-mode .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
footer{font-size:13px;color:#637e7c;border-top:1px solid #d8e6e2;padding:18px 4%;line-height:1.7}
@media(min-width:800px){.hero h1{font-size:44px}.site-head img{width:360px}}
@media(max-width:560px){.site-head img{width:220px}.container{padding:18px 3%}.hero{padding:22px 17px}.hero h1{font-size:29px}.grid{gap:8px}.tile{padding:10px;font-size:16px;min-height:90px;gap:7px}.num{min-width:26px;width:26px;height:28px;font-size:12px}.choiceGrid{grid-template-columns:1fr}.actions{flex-direction:column}.columns>div{min-width:160px}.code{font-size:25px}}
.langGrid .tile{justify-content:center;text-align:center;font-size:22px}
.displayBar.is-hidden{display:none}
.question{font-size:26px;line-height:1.4;margin:26px 0 6px}
.seq{font-size:20px;font-weight:bold;color:#087d70;margin:0}
.note{background:#fff7e8;color:#6b4a14;border-radius:12px;padding:12px 14px;line-height:1.6;font-size:16px}
.countdown{text-align:center;margin-top:-6px}
.error p{margin:0}.error .errorDetail{margin-top:6px;font-size:14px;opacity:.85}
body.visitor .btn.primary{text-align:center}
@media(min-width:800px){.langGrid,body.visitor.display-mode .langGrid{grid-template-columns:repeat(3,minmax(0,1fr))}.question{font-size:30px}}
@media(max-width:560px){.langGrid .tile{font-size:18px;min-height:72px}}

/* Standalone communication kiosk: original PR #175 visuals + offline display additions. */
html,body{min-height:100%} .site-head{border-top-color:#087d70}
.offline-bar{width:100%;background:#143e45;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 4%;flex-wrap:wrap}
.offline-bar strong{font-size:15px}.offline-bar .offline-note{font-size:12px;opacity:.86}
.offline-bar .offline-actions{display:flex;flex-wrap:wrap;gap:7px}
.offline-bar .mini-btn{background:#fff;color:#143e45;font-family:inherit;font-weight:750;font-size:13px;border:0;border-radius:10px;padding:10px 12px;cursor:pointer;min-height:40px}
.offline-bar .mini-btn:hover{background:#e6f5f1}
.offline-bar .mini-btn:focus{outline:3px solid #e7b04b}
.site-head .offline-tag{display:inline-block;font-size:12px;border-radius:99px;background:#e6f5f1;color:#087d70;padding:5px 9px}
body .container{max-width:1140px} .langGrid{grid-template-columns:repeat(3,minmax(0,1fr))}
.offline-helper{font-size:14px;color:#496668;line-height:1.6;margin:14px 0}
.two-langs{display:flex;flex-wrap:wrap;align-items:start;gap:12px;justify-content:space-between}
.two-langs>div{flex:1;min-width:220px}.two-langs .original{font-size:23px;font-weight:800;line-height:1.45;color:#143e45}
.two-langs .korean{font-size:19px;color:#526d6f;line-height:1.5}
.panel.highlight{border-left:6px solid #087d70}.choiceGrid .btn{white-space:normal}
.choiceGrid .btn[aria-pressed=true]{border:3px solid #087d70;background:#e6f5f1}
.warning-banner{background:#fff7e8;color:#6b4a14;border-radius:14px;padding:16px;line-height:1.65}
.summary-pill{display:inline-block;border:1px solid #a8d8ce;border-radius:99px;background:#e6f5f1;color:#087d70;padding:8px 13px;font-weight:800}
body.display-mode .offline-bar{display:none}
body.display-mode .container{max-width:1260px}
body.display-mode .site-head{padding:20px 4%}
body.display-mode .hero h1{font-size:44px}
body.display-mode .tile{min-height:98px;font-size:20px}
body.display-mode .langGrid{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:600px){.offline-bar{align-items:stretch}.offline-bar .offline-actions{width:100%}.offline-bar .offline-actions .mini-btn{flex:1}.langGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.two-langs{display:block}.two-langs>div{min-width:0}body.display-mode .hero h1{font-size:30px}}

function stopTimers(){if(idleTimer){clearTimeout(idleTimer);idleTimer=null;}if(finishedTimer){clearInterval(finishedTimer);finishedTimer=null;}}
function touch(){
  if(idleTimer){clearTimeout(idleTimer);idleTimer=null;}
  if(state.stage==="services"||state.stage==="review")idleTimer=setTimeout(function(){reset();},IDLE_MS);
}
function change(next){state.stage=next;render();}
function reset(){state.stage="language";state.locale="KO";state.page=0;state.service=-1;state.booking="";render();}
function setLanguage(code){state.locale=code;state.stage="services";state.page=0;state.service=-1;state.booking="";render();}
function chooseService(index){state.service=index;state.booking="";change("review");}
function setBooking(value){state.booking=value;render();}
function continueSummary(){if(!state.booking)return;change("summary");}
function renderView(doc,visitor){
  var app=doc.getElementById(visitor?"display-app":"app");
  var foot=doc.getElementById(visitor?"display-foot":"foot");
  if(!app)return;
  clear(app);
  var d=DATA.locales[state.locale], k=d.kiosk, r=d.review;
  doc.documentElement.lang=state.stage==="language"?"ko":state.locale.toLowerCase().split("-")[0];
  if(foot)foot.textContent=(state.stage==="language"?"직원이 안내합니다. / Staff will assist you.":k.footer)+" · 안내용, 신고·예약·발권 처리 없음";
  if(state.stage==="language"){
    app.appendChild(intro(doc,"1 / 3","언어를 선택하세요","Choose your language"));
    var lg=el(doc,"div",null,"grid langGrid");
    for(var i=0;i<LANGS.length;i++)(function(c){
      var b=btn(doc,DATA.locales[c].name,function(){setLanguage(c);},"tile");
      b.lang=c.toLowerCase().split("-")[0];
      lg.appendChild(b);
    })(LANGS[i]);
    app.appendChild(lg);
  }else if(state.stage==="services"){
    app.appendChild(intro(doc,"2 / 3",d.heading[state.page]||d.heading[0],d.instructions[state.page]||""));
    var sg=el(doc,"div",null,"grid"),first=state.page?10:0,last=state.page?20:10;
    for(var s=first;s<last;s++)(function(idx){
      var b=btn(doc,"",function(){chooseService(idx);},"tile");
      add(b,el(doc,"span",idx<9?"0"+(idx+1):String(idx+1),"num"),el(doc,"span",d.services[idx]));
      sg.appendChild(b);
    })(s);
    app.appendChild(sg);
    app.appendChild(actions(doc,
      btn(doc,state.page?k.firstServices:k.moreServices,function(){state.page=1-state.page;render();},"btn primary"),
      btn(doc,k.changeLanguage,function(){change("language");},"btn")));
  }else if(state.stage==="review"){
    app.appendChild(intro(doc,"3 / 3",r.reviewTitle,r.reviewHelp));
    var panel=el(doc,"section",null,"panel highlight");
    add(panel,el(doc,"p",r.serviceLabel,"step"),el(doc,"h2",d.services[state.service]));
    if(state.locale!=="KO"){var ko=note(doc,koService());ko.lang="ko";panel.appendChild(ko);}
    if(state.service===19)panel.appendChild(note(doc,PHONE_NOTES[state.locale],"note"));
    app.appendChild(panel);
    app.appendChild(el(doc,"h2",r.reservationTitle,"question"));
    app.appendChild(note(doc,r.reservationHelp));
    var cg=el(doc,"div",null,"choiceGrid"),options=[["yes",r.answerYes],["no",r.answerNo],["unsure",r.answerUnsure]];
    for(var oi=0;oi<options.length;oi++)(function(op){
      var b=btn(doc,op[1],function(){setBooking(op[0]);},"btn");
      b.setAttribute("aria-pressed",String(state.booking===op[0]));
      cg.appendChild(b);
    })(options[oi]);
    app.appendChild(cg);
    app.appendChild(note(doc,k.noPersonalInfo));
    app.appendChild(actions(doc,
      btn(doc,visitor?"Show to staff / "+(state.locale==="KO"?"직원에게 보여주기":"확인"):"직원에게 보여주기 · Show to staff",continueSummary,"btn primary"),
      btn(doc,k.changeService,function(){change("services");},"btn")));
    var primary=app.querySelector(".actions .primary");if(primary)primary.disabled=!state.booking;
    app.appendChild(note(doc,"이 파일은 정보를 인터넷이나 출입국 전산으로 보내지 않습니다. / No data is transmitted.","offline-helper"));
  }else if(state.stage==="summary"){
    var showTitle={
      "KO":"직원에게 이 화면을 보여주세요",
      "EN":"Please show this screen to staff",
      "ZH-CN":"请向工作人员出示此页面",
      "ID":"Tunjukkan layar ini kepada petugas",
      "HI":"कृपया यह स्क्रीन कर्मचारी को दिखाएँ",
      "VI":"Vui lòng đưa màn hình này cho nhân viên",
      "JA":"この画面を職員に見せてください",
      "TH":"กรุณาแสดงหน้าจอนี้ให้เจ้าหน้าที่ดู",
      "RU":"Пожалуйста, покажите этот экран сотруднику",
      "UZ":"Iltimos, ushbu ekranni xodimga ko‘rsating",
      "MN":"Энэ дэлгэцийг ажилтанд харуулна уу",
      "NE":"कृपया यो स्क्रिन कर्मचारीलाई देखाउनुहोस्"
    };
    var showHelp={
      "KO":"선택한 업무와 예약 여부를 직원과 함께 확인하세요.",
      "EN":"Please confirm your selected service and booking status with staff.",
      "ZH-CN":"请与工作人员确认所选业务及预约情况。",
      "ID":"Konfirmasikan layanan dan status janji temu dengan petugas.",
      "HI":"चुनी गई सेवा और अपॉइंटमेंट की स्थिति कर्मचारी से पुष्टि करें।",
      "VI":"Vui lòng xác nhận dịch vụ và tình trạng đặt lịch với nhân viên.",
      "JA":"選択した手続きと予約状況を職員と一緒に確認してください。",
      "TH":"โปรดตรวจสอบบริการที่เลือกและสถานะการนัดหมายกับเจ้าหน้าที่",
      "RU":"Уточните выбранную услугу и наличие записи у сотрудника.",
      "UZ":"Tanlangan xizmat va bandlov holatini xodim bilan tekshiring.",
      "MN":"Сонгосон үйлчилгээ болон цаг захиалгыг ажилтантай нягтална уу.",
      "NE":"कर्मचारीसँग छानेको सेवा र बुकिङ अवस्था पुष्टि गर्नुहोस्।"
    };
    app.appendChild(intro(doc,"3 / 3 · COMPLETE",showTitle[state.locale],showHelp[state.locale]));
    var sPanel=el(doc,"section",null,"panel highlight");
    sPanel.appendChild(el(doc,"p",r.serviceLabel,"step"));
    sPanel.appendChild(el(doc,"h2",d.services[state.service]));
    if(state.locale!=="KO")sPanel.appendChild(note(doc,koService(),"korean"));
    sPanel.appendChild(el(doc,"p",r.reservationTitle,"step"));
    var bi=state.booking==="yes"?0:state.booking==="no"?1:2;
    sPanel.appendChild(el(doc,"h2",[r.answerYes,r.answerNo,r.answerUnsure][bi]));
    sPanel.appendChild(note(doc,"직원 확인용: "+[DATA.locales.KO.review.answerYes,DATA.locales.KO.review.answerNo,DATA.locales.KO.review.answerUnsure][bi]));
    if(state.service===19)sPanel.appendChild(note(doc,PHONE_NOTES[state.locale],"note"));
    app.appendChild(sPanel);
    app.appendChild(note(doc,"안내 전용입니다. 실제 신고, 예약 확인 및 번호표 발급은 이루어지지 않았습니다.","warning-banner"));
    app.appendChild(actions(doc,btn(doc,r.waitingHome||"처음으로 돌아가기",reset,"btn primary"),
      btn(doc,k.changeService,function(){change("review");},"btn")));
    var count=el(doc,"p",k.autoReset.replace("{s}",String(timeLeft)),"muted countdown");
    count.id=visitor?"display-count":"staff-count";
    count.setAttribute("aria-live","off");
    app.appendChild(count);
  }
}
function render(){
  stopTimers();
  renderView(document,false);
  if(display && !display.closed) {
    try{renderView(display.document,true);}catch(e){display=null;}
  }
  if(state.stage==="summary"){
    timeLeft=RESET_SECONDS;
    var update=function(){
      var ids=["staff-count","display-count"];
      for(var j=0;j<ids.length;j++){
        var doc=ids[j]==="staff-count"?document:(display&&!display.closed?display.document:null);
        if(!doc)continue;
        var label=doc.getElementById(ids[j]);
        if(label)label.textContent=DATA.locales[state.locale].kiosk.autoReset.replace("{s}",String(timeLeft));
      }
    };
    update();
    finishedTimer=setInterval(function(){timeLeft--;if(timeLeft<=0){reset();return;}update();},1000);
  }else touch();
  var view=state.stage+":"+state.page;
  if(lastScreen!==view){
    lastScreen=view;try{window.scrollTo(0,0);}catch(e){}
    if(display&&!display.closed)try{display.scrollTo(0,0);}catch(e){}
  }
}
function openDisplay(){
  if(display && !display.closed){display.focus();renderView(display.document,true);return;}
  var popup=window.open("","ASAD_STANDALONE_DISPLAY","width=1100,height=820,resizable=yes,scrollbars=yes");
  if(!popup){alert("새 창이 차단되었습니다. 팝업을 허용한 뒤 다시 눌러 주세요.");return;}
  var css=document.getElementById("offline-style").textContent;
  var image=document.getElementById("logo").src;
  var markup='<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>민원인 화면 · 출입국 방문 목적</title><style>'+css+'</style></head><body class="visitor display-mode"><header class="site-head"><img alt="제주출입국·외국인청" src="'+image+'"><div><strong>방문 목적 안내 · 민원인 화면</strong><small>오프라인 안내</small></div></header><main id="display-app" class="container" aria-live="polite"></main><footer id="display-foot"></footer></body></html>';
  try{
    popup.document.open();popup.document.write(markup);popup.document.close();
    display=popup;
    renderView(display.document,true);
    display.focus();
  }catch(e){display=null;alert("보조 모니터 창을 열지 못했습니다. 브라우저 팝업 설정을 확인해 주세요.");}
}
function requestFullscreen(){
  var elem=document.documentElement,request=elem.requestFullscreen||elem.webkitRequestFullscreen;
  if(!request){alert("전체화면이 지원되지 않습니다. F11을 사용해 주세요.");return;}
  try{var p=request.call(elem);if(p&&typeof p.catch==="function")p.catch(function(){alert("전체화면 전환이 차단되었습니다. F11을 이용해 주세요.");});}
  catch(e){alert("전체화면이 차단되었습니다. F11을 이용해 주세요.");}
}
document.getElementById("open-display").onclick=openDisplay;
document.getElementById("reset-all").onclick=reset;
document.getElementById("fullscreen").onclick=requestFullscreen;
document.addEventListener("pointerdown",touch,true);
document.addEventListener("touchstart",touch,true);
document.addEventListener("keydown",touch,true);
if(!DATA||!DATA.locales||LANGS.some(function(code){return !DATA.locales[code]||DATA.locales[code].services.length!==20||!DATA.locales[code].kiosk;})){
  root.appendChild(note(document,"번역 자료에 오류가 있습니다.","error"));return;
}
render();
})(window,document);
</script></body></html>
